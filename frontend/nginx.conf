server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser JS can't resolve Docker-internal service DNS names like
    # "backend" directly, so the frontend is built with
    # VITE_API_BASE_URL=/api (same-origin) and this proxies it to the
    # backend container over the Docker network instead.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses browser history mode — any non-file route must
    # fall back to index.html so client-side routing can handle it.
    location / {
        try_files $uri /index.html;
    }
}
